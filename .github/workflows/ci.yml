name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma client di-generate ke packages/api/generated dan tidak
      # ikut di-commit, jadi typecheck butuh langkah ini lebih dulu.
      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          # generate tidak menyentuh database; nilai ini hanya perlu ada
          # karena env() di prisma.config.ts melempar bila variabel kosong.
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/postgres

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
